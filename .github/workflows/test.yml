# This GitHub Actions workflow lints and tests Helm charts on pull requests and pushes to the repository.
name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
        with:
          version: 3.15.0

      # The steps run the make targets that run the same checks locally, see
      # the Tests section of the README.

      # Merging to main publishes the version of Chart.yaml, unless it is
      # published already: a pull request to main that changes the chart must
      # increase it. The pull requests stacked on another branch don't.
      - name: Check the version of the chart
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: make check-version BASE=origin/main

      # Lints the chart once per scenario in charts/plone/ci.
      - name: Run chart-testing (lint)
        run: make lint

      # The unit tests of the templates, in charts/plone/tests.
      - name: Run the unit tests
        run: make test-unit

      # The manifests of each scenario, against the schemas of the oldest
      # supported and the newest Kubernetes versions.
      - name: Validate the manifests
        run: make test-manifests

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0
          kubectl_version: v1.37.2

      # The CloudNativePG operator, the Gateway API CRDs, Traefik with a
      # Gateway, and the ingress-nginx controller.
      - name: Install the cluster dependencies
        run: make cluster-deps

      # Installs the chart once per scenario in charts/plone/ci, with
      # tests/install.sh, in a namespace that enforces the restricted Pod
      # Security profile. Helm waits for the Job that creates the Plone site
      # after the install, which takes a few minutes. Then helm test runs the
      # checks of templates/test-smoke.yaml through the routing: the home page,
      # the public URL in the API, the admin password, and the Varnish cache.
      - name: Install each scenario and run helm test
        run: make test-install

      # Installs the last published release, creates a page and a file,
      # upgrades to the chart of the pull request, and checks them.
      - name: Test the upgrade from the last release
        run: make test-upgrade
