# This GitHub Actions workflow lints and tests Helm charts on pull requests and pushes to the repository.
name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # we can not check against the main branch, because it has a different structure as we are in a refactoring branch
      # skip this
      # - name: Run chart-testing (list-changed)
      #   id: list-changed
      #   run: |
      #     # List the changed charts on the target branch and set the 'changed' output to 'true' if there are any changes.
      #     CHART_DIRS=$(for chartdir in $CHARTS_TO_CHECK; do echo -n ",./${chartdir} "; done)
      #     echo $CHART_DIRS
      #     changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --chart-dirs $CHART_DIRS )
      #     if [[ -n "$changed" ]]; then
      #       echo "changed=true" >> "$GITHUB_OUTPUT"
      #     fi

      - name: Run chart-testing (lint)
        # if: steps.list-changed.outputs.changed == 'true'
        # run: ct lint --target-branch ${{ github.event.repository.default_branch }}
        run: ct lint --all  --chart-dirs ./ --chart-repos cnpg=https://cloudnative-pg.github.io/charts

      - name: Create kind cluster
        # if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # The PostgreSQL clusters of the *-pg charts are managed by the CloudNativePG operator.
      - name: Install CloudNativePG operator
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm upgrade --install cnpg cnpg/cloudnative-pg --namespace cnpg-system --create-namespace --wait

      # plone6-volto-pg-varnish creates an HTTPRoute by default.
      - name: Install Gateway API CRDs
        run: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.7.0/standard-install.yaml

      - name: Run chart-testing (install)
        # if: steps.list-changed.outputs.changed == 'true'
        run: ct install --all  --chart-dirs ./ --chart-repos cnpg=https://cloudnative-pg.github.io/charts --excluded-charts backend,frontend,zeoserver,plone6-classic-nodb
