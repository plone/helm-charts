# Builds the GitHub Pages site: the documentation, and the index.yaml of the
# Helm repository that chart-releaser keeps in the gh-pages branch.
# Pull requests only build and check it. The release workflow calls this one
# after chart-releaser, with deploy set, so that the site serves the new index.
name: Documentation

on:
  pull_request:
  # Every Monday, for the link check: external links break without a change
  # in this repository.
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the site to GitHub Pages"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the site to GitHub Pages"
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # Every value of values.yaml has a row in the values reference, with
      # its default.
      - name: Check the values reference
        run: make docs-values

      - name: Build the documentation and add the Helm repository index
        run: make docs-site

      - name: Check with Vale
        run: make docs-vale DOCS_VALEOPTS="--minAlertLevel=error"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_build/html/

  linkcheck:
    name: Check links
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check that the links of the documentation resolve
        run: make docs-linkcheck

  deploy:
    name: Deploy to GitHub Pages
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs:
      - build
    # Queue deployments: Pages refuses a new one while another is in
    # progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      # The published site serves the documentation and the index of the
      # Helm repository. Pages can take a moment to serve a new deployment.
      - name: Check the published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for page in "" how-to/change-admin-password.html reference/values.html index.yaml; do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 10 -o /dev/null "${SITE_URL}${page}"
            echo "ok ${SITE_URL}${page}"
          done
          curl -fsS "${SITE_URL}index.yaml" | grep -q '^apiVersion: v1'
