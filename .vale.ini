StylesPath = docs/_styles

MinAlertLevel = suggestion

Vocab = Base,Plone

Packages = Microsoft

[*]
BasedOnStyles = Vale, Microsoft
# The targets of sphinx-design cards are page names, not prose.
# MyST substitutions are replaced at build time.
TokenIgnores = (:link: \S+), (\{\{ \w+ \}\})
Microsoft.Contractions = suggestion
Microsoft.Units = suggestion
