apiVersion: v2
name: plone6-volto-pg-nginx-varnish
description: Helmchart to deploy Plone 6 with Volto, PosgreSQL, Varnish and Nginx
type: application
version: 0.2.0
appVersion: "6.0.10"

dependencies:
  - name: "postgresql"
    version: "0.1.0"
    repository: "file://../postgresql"
    import-values:
      - child: dbsecret
        parent: backend.dbsecret

  # Varnish Cache community chart, maintained by Varnish Software.
  # The alias keeps the service name "<release>-varnish" used by nginx.
  - name: "varnish-cache"
    alias: "varnish"
    version: "1.1.1"
    repository: "oci://registry-1.docker.io/varnish"
    import-values:
      - child: server.service.http
        parent: nginx.varnish

  - name: "backend"
    version: "0.1.0"
    repository: "file://../backend"

  - name: "frontend"
    version: "0.1.0"
    repository: "file://../frontend"

  - name: "nginx"
    version: "0.1.0"
    repository: "file://../nginx"

home: https://plone.org
maintainers:
- name: xiru
- name: jensens
- name: fabiorauber
- name: tschorr
sources:
- https://github.com/plone/helm-charts/
