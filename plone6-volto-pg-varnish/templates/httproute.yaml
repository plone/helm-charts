{{- include "plone.routing.validate" . }}
{{- if eq .Values.routing.type "gateway" }}
{{- $r := .Values.routing }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plone.labels" . | nindent 4 }}
  {{- with $r.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "routing.gateway.parentRefs is required" $r.gateway.parentRefs) | nindent 4 }}
  hostnames:
    - {{ $r.hostname | quote }}
  rules:
    # API requests go to the backend through Varnish, rewritten to the Zope virtual host path.
    - matches:
        - path:
            type: PathPrefix
            value: /++api++
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ include "plone.routing.apiPath" . | quote }}
      backendRefs:
        - name: {{ include "plone.routing.apiService" . }}
          port: {{ include "plone.routing.apiPort" . }}
    {{- if $r.staticCache.enabled }}
    # Static assets of the frontend can be cached by browsers.
    - matches:
        - path:
            type: PathPrefix
            value: /static
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: {{ $r.staticCache.cacheControl | quote }}
      backendRefs:
        - name: {{ include "plone.routing.frontendService" . }}
          port: {{ include "plone.routing.frontendPort" . }}
    {{- end }}
    # Everything else goes to the frontend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "plone.routing.frontendService" . }}
          port: {{ include "plone.routing.frontendPort" . }}
{{- end }}
