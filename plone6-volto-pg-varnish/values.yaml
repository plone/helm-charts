# PostgreSQL cluster managed by the CloudNativePG operator (cnpg/cluster chart).
# See https://github.com/cloudnative-pg/charts/tree/main/charts/cluster for all options.
# Set enabled to false to use an external database instead, and point
# backend.databasehost and backend.dbsecret to it.
postgresql:
  enabled: true
  cluster:
    # A single instance, like a plain PostgreSQL pod. For high availability,
    # use 3 instances and set enablePDB to true.
    instances: 1
    enablePDB: false
    # Plone only needs the database owner created by initdb.
    enableSuperuserAccess: false
    storage:
      size: 8Gi
    initdb:
      database: plone
      owner: plone

backend:
  # Connect to the read-write service of the PostgreSQL cluster, with the
  # credentials secret that CloudNativePG generates for the database owner.
  databasehost: "{{ .Release.Name }}-postgresql-rw"
  dbsecret:
    name: "{{ .Release.Name }}-postgresql-app"
    keys:
      database: dbname
      user: username
      password: password

# Routing of the requests:
# - /++api++ goes to the backend through Varnish, rewritten to the Zope virtual
#   host path /VirtualHostBase/<scheme>/<hostname>:<port>/<siteId>/++api++/VirtualHostRoot
# - everything else goes to the Volto frontend
routing:
  # gateway: a Gateway API HTTPRoute attached to an existing Gateway
  # ingress-nginx: Ingress resources with ingress-nginx annotations
  # none: no routing resources, bring your own
  type: gateway
  # Public hostname of the site.
  hostname: localhost
  # Whether clients reach the site over HTTPS, and on which port (defaults to
  # 443 with HTTPS, 80 without). Used to build the virtual host URLs; TLS
  # itself is terminated by the Gateway or the ingress controller.
  https: false
  port: ""
  # Id of the Plone site object in Zope.
  siteId: Plone
  # Let browsers cache the static assets of the frontend (/static).
  staticCache:
    enabled: true
    cacheControl: "public, max-age=31536000"

  gateway:
    # Gateways the HTTPRoute attaches to. They must exist already, usually
    # managed by the cluster administrator.
    parentRefs:
      - name: plone
        # namespace: gateway-system
        # sectionName: http
    annotations: {}

  # The ingress-nginx project is retired since March 2026 and gets no more
  # security fixes. Prefer the gateway type for new installations.
  ingressNginx:
    className: nginx
    annotations: {}
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls: []
    #  - secretName: plone-tls
    #    hosts:
    #      - plone.example.com
    # Static asset caching needs the configuration-snippet annotation, which
    # ingress-nginx only accepts with allow-snippet-annotations enabled.
    allowSnippets: false

# Values for the Varnish Cache community chart (varnish-cache).
# See https://github.com/varnish/helm-varnish-cache for all options.
varnish:
  # Number of backend replicas to balance in the VCL below. Keep it in sync
  # with backend.replicaCount.
  ploneBackendReplicas: 2
  server:
    kind: StatefulSet
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 50%
    service:
      type: ClusterIP
      http:
        port: 6081
    # Round-robin requests between the backend pods, addressed through the
    # headless "<release>-backend-director" service.
    # https://www.varnish-software.com/developers/tutorials/multiple-backends/#loadbalancing-requests-between-multiple-backends
    vclConfig: |
      vcl 4.1;

      import directors;

      {{- $name := .Release.Name -}}
      {{- $replicas := .Values.ploneBackendReplicas | int -}}
      {{- range until $replicas }}
      backend backend{{ . }} {
          .host = "{{ $name }}-backend-{{ . }}.{{ $name }}-backend-director";
          .port = "8080";
      }
      {{- end }}

      sub vcl_init {
          new vdir = directors.round_robin();
          {{- range until $replicas }}
          vdir.add_backend(backend{{ . }});
          {{- end }}
      }

      sub vcl_recv {
          set req.backend_hint = vdir.backend();
      }
