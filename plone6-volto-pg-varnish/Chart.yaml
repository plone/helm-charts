apiVersion: v2
name: plone6-volto-pg-varnish
description: Helmchart to deploy Plone 6 with Volto, PostgreSQL and Varnish, routed with Gateway API or ingress-nginx
type: application
version: 0.2.0
appVersion: "6.0.10"

dependencies:
  # PostgreSQL cluster managed by the CloudNativePG operator, which must be
  # installed in the Kubernetes cluster beforehand. See the README.
  - name: "cluster"
    alias: "postgresql"
    version: "0.9.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: postgresql.enabled

  # Varnish Cache community chart, maintained by Varnish Software.
  # The alias names its service "<release>-varnish", used by the API route.
  - name: "varnish-cache"
    alias: "varnish"
    version: "1.1.1"
    repository: "oci://registry-1.docker.io/varnish"

  - name: "backend"
    version: "0.2.0"
    repository: "file://../backend"

  - name: "frontend"
    version: "0.1.0"
    repository: "file://../frontend"

home: https://plone.org
maintainers:
- name: xiru
- name: jensens
- name: fabiorauber
- name: tschorr
sources:
- https://github.com/plone/helm-charts/
