apiVersion: v2
name: plone6-classic-pg
description: Helmchart to deploy Plone 6 Classic with PosgreSQL
type: application
version: 0.2.0
appVersion: "6.0.10"

dependencies:
  # PostgreSQL cluster managed by the CloudNativePG operator, which must be
  # installed in the Kubernetes cluster beforehand. See the README.
  - name: "cluster"
    alias: "postgresql"
    version: "0.9.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: postgresql.enabled

  - name: "backend"
    version: "0.2.0"
    repository: "file://../backend"

home: https://plone.org
maintainers:
- name: xiru
- name: jensens
- name: fabiorauber
- name: tschorr
sources:
- https://github.com/plone/helm-charts/
