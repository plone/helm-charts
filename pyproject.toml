[project]
name = "plone-helm-charts"
version = "0"
description = "Tooling for the documentation of the Plone Helm chart"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "linkify-it-py>=2.0.3",
    "myst-parser>=4.0.0",
    "plone-sphinx-theme>=1.4.3",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-notfound-page>=1.0.4",
    "sphinx-sitemap>=2.6.0",
    "sphinxext-opengraph>=0.9.1",
    "vale>=3.9.0",
]

[tool.uv]
# This repository holds Helm charts, not a Python package: uv only manages
# the environment of the documentation tools.
package = false
