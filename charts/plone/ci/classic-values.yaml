# Classic UI, PostgreSQL with CloudNativePG, Gateway API.
frontend:
  enabled: false
routing:
  gateway:
    # The Gateway of Traefik, installed by make cluster-deps.
    name: traefik-gateway
    namespace: traefik
# helm test sends its requests through Traefik.
tests:
  url: http://traefik.traefik.svc.cluster.local
