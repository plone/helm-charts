# Ephemeral storage: the backend runs its own FileStorage, with no ZEO server and
# no PostgreSQL, and the chart creates no site Job. The image creates the site
# when it starts, from SITE, in place of an image that has the site in its data.
storage:
  type: ephemeral
postgresql:
  enabled: false
backend:
  env:
    - name: SITE
      value: Plone
routing:
  gateway:
    # The Gateway of Traefik, installed by make cluster-deps.
    name: traefik-gateway
    namespace: traefik
# helm test sends its requests through Traefik.
tests:
  url: http://traefik.traefik.svc.cluster.local
