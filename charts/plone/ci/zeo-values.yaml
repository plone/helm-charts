# Volto, ZEO server of the chart, Gateway API.
storage:
  type: zeo
postgresql:
  enabled: false
routing:
  gateway:
    # The Gateway of Traefik, installed by the CI workflow.
    name: traefik-gateway
    namespace: traefik
# helm test sends its requests through Traefik.
tests:
  url: http://traefik.traefik.svc.cluster.local
