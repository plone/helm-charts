# Volto, PostgreSQL with CloudNativePG, Varnish, ingress-nginx.
# Two backend pods, to test Varnish with several pods behind the Service.
backend:
  replicas: 2
varnish:
  enabled: true
routing:
  type: ingress-nginx
# helm test sends its requests through the ingress-nginx controller, installed by
# the CI workflow.
tests:
  url: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
