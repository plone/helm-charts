apiVersion: v2
name: plone
description: Beta. Plone 6 with the Volto or Classic UI, on PostgreSQL (RelStorage), ZEO, or ephemeral storage, with optional Varnish, routed with Gateway API, Traefik, or ingress-nginx
type: application
version: 0.4.3
appVersion: "6.2.3"
kubeVersion: ">=1.29.0-0"

keywords:
- plone
- zope
- volto
- cms
- relstorage
- zeo

dependencies:
  # PostgreSQL cluster managed by the CloudNativePG operator, which must be
  # installed in the Kubernetes cluster beforehand. See the README.
  - name: "cluster"
    alias: "postgresql"
    version: "0.9.0"
    repository: "oci://ghcr.io/cloudnative-pg/charts"
    condition: postgresql.enabled

  # Varnish Cache community chart, maintained by Varnish Software.
  - name: "varnish-cache"
    alias: "varnish"
    version: 1.10.0
    repository: "oci://registry-1.docker.io/varnish"
    condition: varnish.enabled

home: https://plone.org
sources:
- https://github.com/plone/helm-charts/
maintainers:
- name: fabiorauber
  url: https://github.com/fabiorauber
- name: ericof
  email: ericof@plone.org
  url: https://github.com/ericof
