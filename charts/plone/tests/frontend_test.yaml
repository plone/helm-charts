# The Volto frontend.
suite: frontend
templates:
  - templates/frontend-deployment.yaml
  - templates/frontend-service.yaml
  - templates/frontend-pdb.yaml
release:
  name: plone
  namespace: plone
set:
  routing.gateway.name: gw
tests:
  - it: renders on the server through the backend Service
    template: templates/frontend-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAZZLE_INTERNAL_API_PATH
            value: http://plone-backend:8080/Plone

  - it: has no frontend with the Classic UI
    set:
      frontend.enabled: false
    asserts:
      - template: templates/frontend-deployment.yaml
        hasDocuments:
          count: 0
      - template: templates/frontend-service.yaml
        hasDocuments:
          count: 0

  - it: has a PodDisruptionBudget only with more replicas
    template: templates/frontend-pdb.yaml
    set:
      frontend.replicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: has a startup probe on /ok
    template: templates/frontend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /ok
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
