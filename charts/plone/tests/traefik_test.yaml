# The traefik routing: Ingress resources for the Ingress provider of Traefik, and
# the Middleware resources that rewrite the backend paths, as the annotations of
# ingress-nginx do.
suite: traefik routing
templates:
  - templates/traefik-ingress.yaml
  - templates/traefik-ingress-api.yaml
  - templates/traefik-middleware.yaml
release:
  name: plone
  namespace: plone
set:
  routing.type: traefik
  routing.hostname: plone.example.org
tests:
  - it: creates the Ingress of the frontend, with the IngressClass of Traefik
    template: templates/traefik-ingress.yaml
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.rules[0].host
          value: plone.example.org
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: plone-frontend
      - notExists:
          path: metadata.annotations

  - it: routes the API of Volto to the backend, through the rewrite Middleware
    template: templates/traefik-ingress-api.yaml
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /++api++
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: plone-backend
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: plone-plone-api-rewrite@kubernetescrd

  - it: rewrites the API paths of Volto as ingress-nginx does
    template: templates/traefik-middleware.yaml
    asserts:
      - isKind:
          of: Middleware
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1
      - equal:
          path: metadata.name
          value: plone-api-rewrite
      - equal:
          path: spec.replacePathRegex.regex
          value: ^/\+\+api\+\+($|/.*)
      - equal:
          path: spec.replacePathRegex.replacement
          value: /VirtualHostBase/http/plone.example.org:80/Plone/++api++/VirtualHostRoot$1

  - it: sends everything to the backend with the Classic UI, rewritten to the virtual host
    template: templates/traefik-middleware.yaml
    set:
      frontend.enabled: false
    asserts:
      - equal:
          path: metadata.name
          value: plone-rewrite
      - equal:
          path: spec.replacePathRegex.regex
          value: ^/(.*)
      - equal:
          path: spec.replacePathRegex.replacement
          value: /VirtualHostBase/http/plone.example.org:80/Plone/VirtualHostRoot/$1

  - it: attaches the Classic UI Ingress to the rewrite Middleware and creates no API Ingress
    set:
      frontend.enabled: false
    asserts:
      - template: templates/traefik-ingress.yaml
        equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: plone-plone-rewrite@kubernetescrd
      - template: templates/traefik-ingress.yaml
        equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: plone-backend
      - template: templates/traefik-ingress-api.yaml
        hasDocuments:
          count: 0

  - it: sets the class, the annotations and the TLS of routing.traefik on the Ingress resources
    set:
      routing.traefik.className: traefik-edge
      routing.traefik.annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      routing.traefik.tls:
        - secretName: plone-tls
          hosts:
            - plone.example.org
    asserts:
      - template: templates/traefik-ingress-api.yaml
        equal:
          path: spec.ingressClassName
          value: traefik-edge
      - template: templates/traefik-ingress-api.yaml
        equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
      - template: templates/traefik-ingress.yaml
        equal:
          path: spec.tls[0].secretName
          value: plone-tls
      - template: templates/traefik-ingress.yaml
        equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: creates no Traefik resources with the gateway routing
    set:
      routing.type: gateway
      routing.gateway.name: gw
    asserts:
      - template: templates/traefik-ingress.yaml
        hasDocuments:
          count: 0
      - template: templates/traefik-ingress-api.yaml
        hasDocuments:
          count: 0
      - template: templates/traefik-middleware.yaml
        hasDocuments:
          count: 0

  - it: creates no Traefik resources with routing none
    set:
      routing.type: none
    asserts:
      - template: templates/traefik-middleware.yaml
        hasDocuments:
          count: 0
      - template: templates/traefik-ingress.yaml
        hasDocuments:
          count: 0
