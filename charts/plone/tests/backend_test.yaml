# The backend Deployment, its Service, and its PodDisruptionBudget.
suite: backend
templates:
  - templates/backend-deployment.yaml
  - templates/backend-service.yaml
  - templates/backend-pdb.yaml
release:
  name: plone
  namespace: plone
set:
  routing.gateway.name: gw
tests:
  - it: is a Deployment that starts a new pod before it stops an old one
    template: templates/backend-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: plone-backend
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: uses the appVersion of the chart as the default image tag
    template: templates/backend-deployment.yaml
    chart:
      appVersion: 6.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/plone/plone-backend:6.9.9

  - it: sets the size of the ZODB cache, then backend.env
    template: templates/backend-deployment.yaml
    set:
      backend.env:
        - name: EXTRA
          value: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: ZODB_CACHE_SIZE
            value: "50000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRA
            value: "1"

  - it: uses fullnameOverride as the prefix of the names
    template: templates/backend-service.yaml
    set:
      fullnameOverride: web
    asserts:
      - equal:
          path: metadata.name
          value: web-backend
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: has no PodDisruptionBudget with one replica
    template: templates/backend-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: has a PodDisruptionBudget with more replicas
    template: templates/backend-pdb.yaml
    set:
      backend.replicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 50%

  - it: has no PodDisruptionBudget when it is disabled
    template: templates/backend-pdb.yaml
    set:
      backend.replicas: 2
      backend.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: checks /ok for startup and readiness, and a TCP connection for liveness
    template: templates/backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /ok
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ok
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
