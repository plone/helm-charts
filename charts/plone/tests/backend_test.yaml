# The backend Deployment, its Service, and its PodDisruptionBudget.
suite: backend
templates:
  - templates/backend-deployment.yaml
  - templates/backend-service.yaml
  - templates/backend-pdb.yaml
release:
  name: plone
  namespace: plone
set:
  routing.gateway.name: gw
tests:
  - it: is a Deployment that starts a new pod before it stops an old one
    template: templates/backend-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: plone-backend
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: uses the appVersion of the chart as the default image tag
    template: templates/backend-deployment.yaml
    chart:
      appVersion: 6.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/plone/plone-backend:6.9.9

  - it: sets the size of the ZODB cache, the storage, then backend.env
    template: templates/backend-deployment.yaml
    set:
      backend.env:
        - name: EXTRA
          value: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: ZODB_CACHE_SIZE
            value: "50000"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: DBHOST
      - equal:
          path: spec.template.spec.containers[0].env[8].name
          value: RELSTORAGE_BLOB_CACHE_SIZE
      # backend.env comes last, so that it can override the variables above.
      - equal:
          path: spec.template.spec.containers[0].env[9]
          value:
            name: EXTRA
            value: "1"
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 10

  - it: uses fullnameOverride as the prefix of the names
    template: templates/backend-service.yaml
    set:
      fullnameOverride: web
    asserts:
      - equal:
          path: metadata.name
          value: web-backend
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: has no PodDisruptionBudget with one replica
    template: templates/backend-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: has a PodDisruptionBudget with more replicas
    template: templates/backend-pdb.yaml
    set:
      backend.replicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 50%

  - it: has no PodDisruptionBudget when it is disabled
    template: templates/backend-pdb.yaml
    set:
      backend.replicas: 2
      backend.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sleeps before it stops, within the grace period
    template: templates/backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]

  - it: has no preStop hook with backend.preStopSleepSeconds 0
    template: templates/backend-deployment.yaml
    set:
      backend.preStopSleepSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
