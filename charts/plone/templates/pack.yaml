{{- if .Values.pack.enabled }}
{{- $b := .Values.backend }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "plone.fullname" . }}-pack
  labels:
    {{- include "plone.labels" . | nindent 4 }}
    app.kubernetes.io/component: pack
spec:
  schedule: {{ .Values.pack.schedule | quote }}
  {{- with .Values.pack.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.pack.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.pack.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "plone.selectorLabels" (dict "context" . "component" "pack") | nindent 12 }}
        spec:
          {{- include "plone.serviceAccount" . | nindent 10 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: pack
              image: "{{ $b.image.repository }}:{{ $b.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ $b.image.pullPolicy }}
              {{- with $b.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              # zodbpack with RelStorage, zeopack with ZEO.
              args:
                - pack
                - -d
                - {{ .Values.pack.days | quote }}
              env:
                {{- include "plone.storageEnv" . | nindent 16 }}
                {{- with $b.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with .Values.pack.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.pack.resources | nindent 16 }}
          {{- with .Values.pack.nodeSelector | default $b.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pack.affinity | default $b.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pack.tolerations | default $b.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
