{{- if eq .Values.routing.type "gateway" }}
{{- $r := .Values.routing }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "plone.fullname" . }}
  labels:
    {{- include "plone.labels" . | nindent 4 }}
  {{- with $r.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "routing.gateway.parentRefs is required" $r.gateway.parentRefs) | nindent 4 }}
  hostnames:
    - {{ $r.hostname | quote }}
  rules:
    {{- if .Values.frontend.enabled }}
    # API requests go to the backend, rewritten to the Zope virtual host path.
    - matches:
        - path:
            type: PathPrefix
            value: /++api++
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ include "plone.routing.backendPath" . | quote }}
      backendRefs:
        - name: {{ include "plone.routing.backendService" . }}
          port: {{ include "plone.routing.backendPort" . }}
    # Everything else goes to the frontend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "plone.routing.frontendService" . }}
          port: {{ .Values.frontend.service.port }}
    {{- else }}
    # Classic UI: everything goes to the backend, rewritten to the Zope virtual host path.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ include "plone.routing.backendPath" . | quote }}
      backendRefs:
        - name: {{ include "plone.routing.backendService" . }}
          port: {{ include "plone.routing.backendPort" . }}
    {{- end }}
{{- end }}
