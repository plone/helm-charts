{{- if .Values.frontend.enabled }}
{{- $fullname := include "plone.fullname" . }}
{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "plone.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      {{- include "plone.selectorLabels" (dict "context" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      {{- with $f.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "plone.selectorLabels" (dict "context" . "component" "frontend") | nindent 8 }}
    spec:
      {{- include "plone.serviceAccount" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "plone.terminationGracePeriod" $f | nindent 6 }}
      {{- with $f.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          imagePullPolicy: {{ $f.image.pullPolicy }}
          {{- with $f.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Server-side rendering calls the backend directly.
            - name: RAZZLE_INTERNAL_API_PATH
              value: "http://{{ $fullname }}-backend:{{ .Values.backend.service.port }}/{{ .Values.site.id }}"
            {{- with $f.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with $f.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "plone.preStop" $f | nindent 10 }}
          resources:
            {{- toYaml $f.resources | nindent 12 }}
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
