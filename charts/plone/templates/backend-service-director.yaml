# Headless governing service of the backend StatefulSet, required by
# StatefulSets. It gives each pod a stable DNS name,
# <fullname>-backend-<n>.<fullname>-backend-director.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plone.fullname" . }}-backend-director
  labels:
    {{- include "plone.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "plone.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
