{{- if not .Values.site.admin.existingSecret }}
{{- $name := include "plone.admin.secretName" . }}
{{- /* Keep the password of an existing Secret, so that upgrades don't change it. */}}
{{- $password := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with .data }}
{{- with index . "password" }}
{{- $password = b64dec . }}
{{- end }}
{{- end }}
{{- end }}
# Password of the admin user of the Zope root, generated on install. See
# site.admin in values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "plone.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
